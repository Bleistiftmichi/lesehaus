<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/app.css">
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #c { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .title { font-family: Andika, sans-serif; font-weight: 700; color: #1d8a75; }
</style></head>
<body><div id="c"></div>
<script type="module">
  import { elmaMarkup } from '../js/elma.js';
  const q = new URLSearchParams(location.search);
  const mode = q.get('mode');
  const c = document.getElementById('c');
  const W = innerWidth, H = innerHeight;
  if (mode === 'splash') {
    c.style.background = '#fff8ec';
    const s = Math.min(W, H) * 0.45;
    c.innerHTML = `<div style="width:${s}px;height:${s}px">${elmaMarkup('hallo')}</div><div class="title" style="font-size:${s * 0.22}px;margin-top:${s * 0.08}px">Lesehaus</div>`;
  } else {
    const scale = mode === 'maskable' ? 0.62 : 0.8;
    c.style.background = 'radial-gradient(circle at 50% 42%, #fff6d8 0%, #ffe7a8 55%, #ffd77a 100%)';
    c.innerHTML = `<div style="width:${W * scale}px;height:${W * scale}px;margin-top:${W * 0.04}px">${elmaMarkup('freut')}</div>`;
  }
  await document.fonts.ready;
  document.body.dataset.ready = '1';
</script></body></html>
